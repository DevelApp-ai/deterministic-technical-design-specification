apiVersion: v2
name: dtds-docs
description: >-
  Helm chart for the Deterministic Technical Design Specification (DTDS)
  documentation site.  Deploys an nginx pod that serves the MkDocs static
  site generated by the deterministic documentation pipeline.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - documentation
  - dtds
  - mkdocs
  - documentation-as-code
home: https://github.com/DevelApp-ai/deterministic-technical-design-specification
sources:
  - https://github.com/DevelApp-ai/deterministic-technical-design-specification
maintainers:
  - name: platform-team
    url: https://github.com/DevelApp-ai
annotations:
  # Machine-readable traceability
  dtds/related_requirements: "K-001,K-002,K-003"
  dtds/related_adr: "ADR-0008"
