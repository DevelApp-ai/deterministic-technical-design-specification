# kubernetes/deployment.yaml
#
# Example Deployment for the DTDS docs site (nginx serving the MkDocs output).
# Demonstrates several policies enforced by OPA K8S-001 through K8S-003:
#   - No privileged containers (K8S-001)
#   - CPU/memory limits required (K8S-002)
#   - Read-only root filesystem (K8S-003)
#
# Machine-readable metadata:
#   related_requirements: [K-001, K-002, K-003]
#   related_adr: [ADR-0008]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtds-docs
  namespace: dtds-example
  labels:
    app.kubernetes.io/name: dtds-docs
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: documentation
    app.kubernetes.io/managed-by: helm
    environment: staging
    app_name: dtds-example
    owner: platform-team
    cost_center: CC-1001
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dtds-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtds-docs
        app.kubernetes.io/version: "0.1.0"
        environment: staging
        app_name: dtds-example
        owner: platform-team
        cost_center: CC-1001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101        # nginx non-root user
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: docs-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: docs-content
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
