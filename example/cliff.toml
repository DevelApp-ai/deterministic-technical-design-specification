# [changelog]
# trim = true
# postprocessors = [
#   { pattern = '\[(\w+)-(\d+)\]', replace = "[$1-$2](https://github.com/DevelApp-ai/deterministic-technical-design-specification/issues/$2)" },
# ]

[changelog.header]
content = """
# Changelog

All notable changes to this project will be documented in this file.
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.0.0/);
versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

[changelog.body]
content = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/DevelApp-ai/deterministic-technical-design-specification/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

[changelog.footer]
content = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  { message = "^feat",     group = "🚀 Features"    },
  { message = "^fix",      group = "🐛 Bug Fixes"   },
  { message = "^docs",     group = "📖 Documentation"},
  { message = "^perf",     group = "⚡ Performance"  },
  { message = "^refactor", group = "🔨 Refactoring"  },
  { message = "^style",    group = "🎨 Style"        },
  { message = "^test",     group = "🧪 Tests"        },
  { message = "^chore",    group = "🧹 Chores"       },
  { message = "^ci",       group = "⚙️ CI/CD"        },
  { message = "^revert",   group = "⏪ Reverts"      },
  { body = ".*security",   group = "🔒 Security"     },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
