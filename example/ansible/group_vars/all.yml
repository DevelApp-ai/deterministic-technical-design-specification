# ansible/group_vars/all.yml — variables shared across ALL host groups
#
# These defaults apply to every host in the inventory.  Override per-group
# in group_vars/<group>.yml or per-host in host_vars/<hostname>.yml.
#
# Related requirements: M-003, S-001, CYB-002, CYB-003, DORA-002

---
# ---------------------------------------------------------------------------
# CIS Benchmark — password policy
# ---------------------------------------------------------------------------
cis_password_max_days: 90
cis_password_min_days: 7
cis_password_min_length: 14
cis_password_complexity_enabled: true

# ---------------------------------------------------------------------------
# CIS Benchmark — SSH hardening
# ---------------------------------------------------------------------------
cis_ssh_permit_root_login: "no"
cis_ssh_permit_empty_passwords: "no"
cis_ssh_max_auth_tries: 4
cis_ssh_client_alive_interval: 300
cis_ssh_client_alive_count_max: 3
cis_ssh_protocol_version: 2
cis_ssh_ciphers:
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
cis_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256

# ---------------------------------------------------------------------------
# Kernel hardening — sysctl
# ---------------------------------------------------------------------------
sysctl_settings:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_redirects: 0
  kernel.randomize_va_space: 2
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1

# ---------------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------------
report_output_dir: "{{ playbook_dir }}/../docs/generated"
report_author: "ansible-automation"
report_environment: "{{ lookup('env', 'ENVIRONMENT') | default('dev') }}"

# ---------------------------------------------------------------------------
# DORA evidence collection
# ---------------------------------------------------------------------------
dora_evidence_output_dir: "{{ playbook_dir }}/../docs/generated/dora"
dora_retention_days: 90
dora_contact_email: "security@example.com"
