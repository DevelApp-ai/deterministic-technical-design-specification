# ansible/site.yml — master orchestration playbook
#
# Applies all roles to the appropriate host groups in the correct order:
#   1. security_baseline — OS hardening for every managed host
#   2. patching          — automated security patch currency (DORA Art.10)
#   3. monitoring        — CloudWatch agent installation (DORA Art.10)
#   4. dora_evidence     — DORA audit evidence collection
#
# Usage — full site:
#   ansible-playbook -i inventory.yml site.yml
#
# Usage — specific host group:
#   ansible-playbook -i inventory.yml site.yml --limit webservers
#
# Usage — dry-run (check mode):
#   ansible-playbook -i inventory.yml site.yml --check --diff
#
# Usage — only certain tags:
#   ansible-playbook -i inventory.yml site.yml --tags "hardening"
#   ansible-playbook -i inventory.yml site.yml --tags "patching"
#   ansible-playbook -i inventory.yml site.yml --tags "monitoring"
#
# Related ADR:          docs/adrs/0003-use-ansible-for-linux-config.md
# Related requirements: M-003, S-001, CYB-002, CYB-003, DORA-002, DORA-003

---
- name: Apply security baseline to all managed hosts
  hosts: all
  gather_facts: true
  become: false   # Set to true when running against real targets
  roles:
    - role: security_baseline
      tags: [hardening, security]

- name: Apply security patches (DORA Art.10 patch currency)
  hosts: all
  gather_facts: true
  become: false
  roles:
    - role: patching
      tags: [patching, dora]

- name: Install and configure monitoring agent (DORA Art.10)
  hosts: all
  gather_facts: true
  become: false
  roles:
    - role: monitoring
      tags: [monitoring, dora]

- name: Collect DORA audit evidence from all managed hosts
  hosts: all
  gather_facts: true
  become: false
  roles:
    - role: dora_evidence
      tags: [dora, compliance, audit]

- name: Verify backup currency and run restore tests (DORA Art.12)
  hosts: all
  gather_facts: true
  become: false
  roles:
    - role: backup_verify
      tags: [backup, dora]

- name: Inventory and verify TLS certificates (NIS2 Art.21(2)(h))
  hosts: all
  gather_facts: true
  become: false
  roles:
    - role: certificate_management
      tags: [certificates, nis2]

- name: Generate host inventory report
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Render host report from Jinja2 template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/host-report.md.j2"
        dest: "{{ playbook_dir }}/../docs/generated/host-report-{{ inventory_hostname }}.md"
        mode: "0644"
      delegate_to: localhost
      tags: [reporting, docs]
